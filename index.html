<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRMNL Surf Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: 'Heebo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 900;
      margin: 0;
      color: var(--accent);
    }
    .header p {
      font-size: 13px;
      color: var(--subtext);
      margin-top: 4px;
    }
    .card {
      background-color: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
      font-family: 'Heebo', sans-serif;
      box-sizing: border-box;
      margin-bottom: 18px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    .settings-toggle {
      font-size: 12px;
      color: var(--subtext);
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: underline;
    }
    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      font-weight: 700;
      display: none;
    }
    .status-success { background: #064e3b; color: #34d399; }
    .status-error { background: #7f1d1d; color: #f87171; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🏄‍♂️ TRMNL Surf Control</h1>
      <p>עדכון חוף ותחזית בלחיצה אחת</p>
    </div>

    <div class="card">
      <label for="beachSelect">בחר חוף:</label>
      <select id="beachSelect">
        <option value="olga">חוף אולגה (חדרה)</option>
        <option value="sdot-yam">שדות ים</option>
        <option value="caesarea">קיסריה</option>
        <option value="michmoret">מכמורת</option>
        <option value="beit-yanai">בית ינאי</option>
        <option value="herzliya">הרצליה - דבוש / מרינה</option>
        <option value="hilton">תל אביב - הילטון</option>
        <option value="gordon">תל אביב - גורדון</option>
        <option value="maravi">תל אביב - חוף מערבי</option>
        <option value="palmachim">פלמחים</option>
        <option value="ashdod">אשדוד - חוף הקשתות</option>
        <option value="ashqelon">אשקלון - דלילה</option>
        <option value="haifa-peak">חיפה - הפיק</option>
        <option value="haifa-backdoor">חיפה - בקדור</option>
        <option value="betzet">בצת</option>
        <option value="nahariya">נהריה - סוקולוב</option>
      </select>

      <label for="hourSelect">שעת תחזית לטבלה:</label>
      <select id="hourSelect">
        <option value="6">06:00 (בוקר)</option>
        <option value="9">09:00 (בוקר מאוחר)</option>
        <option value="12" selected>12:00 (צהריים)</option>
        <option value="15">15:00 (אחר הצהריים)</option>
        <option value="18">18:00 (ערב)</option>
      </select>

      <button onclick="triggerGitHubWorkflow()">🚀 עדכן את המכשיר</button>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- הגדרות חיבור ל-GitHub (מוזנות פעם אחת בלבד ונשמרות בזיכרון הטלפון) -->
    <div class="card hidden" id="settingsCard">
      <label for="ghUser">GitHub Username:</label>
      <input type="text" id="ghUser" placeholder="שם המשתמש ב-GitHub">

      <label for="ghRepo">Repository Name:</label>
      <input type="text" id="ghRepo" placeholder="שם ה-Repo">

      <label for="ghToken">Personal Access Token (PAT):</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">

      <button onclick="saveSettings()" style="background: #334155;">שמור הגדרות</button>
    </div>

    <div class="settings-toggle" onclick="toggleSettings()">⚙️ הגדרות חיבור (פעם אחת בלבד)</div>
  </div>

  <script>
    window.onload = function() {
      // טעינת הגדרות שנשמרו בזיכרון המקומי בדפדפן
      if(localStorage.getItem('gh_user')) document.getElementById('ghUser').value = localStorage.getItem('gh_user');
      if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
      if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
      
      if(!localStorage.getItem('gh_token')) {
        document.getElementById('settingsCard').classList.remove('hidden');
      }
    };

    function toggleSettings() {
      const card = document.getElementById('settingsCard');
      card.classList.toggle('hidden');
    }

    function saveSettings() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      alert('ההגדרות נשמרו בטלפון!');
      document.getElementById('settingsCard').classList.add('hidden');
    }

    async function triggerGitHubWorkflow() {
      const beach = document.getElementById('beachSelect').value;
      const hour = document.getElementById('hourSelect').value;
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');
      const status = document.getElementById('statusMsg');

      if (!user || !repo || !token) {
        alert('אנא הזרק תחילה את הגדרות ה-GitHub שלך מאיזור ההגדרות למטה.');
        document.getElementById('settingsCard').classList.remove('hidden');
        return;
      }

      status.style.display = 'block';
      status.className = 'status-msg';
      status.innerText = 'מפעיל את ה-Action ב-GitHub...';

      const url = `https://api.github.com/repos/${user}/${repo}/actions/workflows/surf.yml/dispatches`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              beach: beach,
              hour: hour
            }
          })
        });

        if (response.status === 204) {
          status.className = 'status-msg status-success';
          status.innerText = '✅ הנתונים נשלחו! ה-Action רץ ויעדכן את הטרמינל תוך שניות.';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || 'שגיאה בהפעלת ה-Workflow');
        }
      } catch (err) {
        status.className = 'status-msg status-error';
        status.innerText = '❌ ' + err.message;
      }
    }
  </script>
</body>
</html>
