<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRMNL Surf - בחירת חוף</title>
  <style>
    body { font-family: sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; direction: rtl; text-align: center;}
    .card { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    select, button, input { width: 100%; padding: 15px; margin-top: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background: #2563eb; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 20px;}
    .status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🏄‍♂️ עדכון חוף למסך</h2>
    
    <label style="display:block; text-align:right; margin-top:10px;">Token גישה (Github PAT):</label>
    <input type="password" id="ghToken" placeholder="הדבק כאן את הטוקן פעם אחת..." onchange="saveToken()">
    
    <label style="display:block; text-align:right; margin-top:15px;">בחר חוף:</label>
    <select id="beachSelect">
      <option value="olga">חוף אולגה</option>
      <option value="hilton">תל אביב - הילטון</option>
      <option value="herzliya">הרצליה</option>
      <option value="palmachim">פלמחים</option>
      <option value="sdot-yam">שדות ים</option>
      <option value="ashdod">אשדוד</option>
      <option value="haifa-peak">חיפה - הפיק</option>
    </select>
    
    <button onclick="triggerUpdate()">עדכן עכשיו!</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const REPO = "nery93-web/trmnl-surf";
    
    window.onload = () => {
      const saved = localStorage.getItem("gh_pat");
      if(saved) document.getElementById("ghToken").value = saved;
    };

    function saveToken() {
      localStorage.setItem("gh_pat", document.getElementById("ghToken").value.trim());
    }

    async function triggerUpdate() {
      const token = document.getElementById("ghToken").value.trim();
      const beach = document.getElementById("beachSelect").value;
      const statusDiv = document.getElementById("status");

      if (!token) { statusDiv.style.color = "red"; statusDiv.innerText = "חסר טוקן!"; return; }
      
      saveToken();
      statusDiv.style.color = "blue";
      statusDiv.innerText = "שולח עדכון...";

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/surf.yml/dispatches`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref: "main", inputs: { beach: beach } })
        });

        if (res.ok || res.status === 204) {
          statusDiv.style.color = "green"; statusDiv.innerText = "✓ נשלח! המסך יתעדכן בדקה הקרובה.";
        } else {
          statusDiv.style.color = "red"; statusDiv.innerText = "שגיאה, בדוק את הטוקן.";
        }
      } catch (e) {
        statusDiv.style.color = "red"; statusDiv.innerText = "שגיאת רשת.";
      }
    }
  </script>
</body>
</html>
