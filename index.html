<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRMNL Surf Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
    }
    body {
      font-family: 'Heebo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-top: 6px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 900;
      margin: 0;
      color: var(--primary);
      letter-spacing: -0.3px;
    }
    .header p {
      font-size: 13px;
      color: var(--subtext);
      margin-top: 3px;
      font-weight: 500;
    }
    .card {
      background-color: var(--card);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    select, input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      font-family: 'Heebo', sans-serif;
      box-sizing: border-box;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }
    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    .settings-toggle {
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      text-align: center;
      cursor: pointer;
      margin-top: 12px;
      padding: 6px;
    }
    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13.5px;
      text-align: center;
      font-weight: 700;
      display: none;
      line-height: 1.4;
    }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .status-info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🏄‍♂️ TRMNL Surf Control</h1>
      <p>עדכון חוף ותחזית בלחיצה אחת</p>
    </div>

    <div class="card">
      <label for="beachSelect">בחר חוף:</label>
      <select id="beachSelect">
        <!-- מרכז / שרון -->
        <option value="olga" selected>חוף אולגה (חדרה)</option>
        <option value="sdot-yam">שדות ים</option>
        <option value="caesarea">קיסריה</option>
        <option value="michmoret">מכמורת</option>
        <option value="beit-yanai">בית ינאי</option>
        <option value="blue-bay">נתניה - בלוי ביי</option>
        <option value="sironit">נתניה - סירונית</option>
        <option value="poleg">נתניה - פולג</option>
        <option value="herzliya">הרצליה - דבוש / מרינה</option>
        <option value="herzliya-zabulon">הרצליה - זבולון</option>
        
        <!-- תל אביב והסביבה -->
        <option value="hatsuk">תל אביב - הצוק</option>
        <option value="country">תל אביב - קאנטרי</option>
        <option value="tel-baruch">תל אביב - תל ברוך</option>
        <option value="hilton">תל אביב - הילטון</option>
        <option value="gordon">תל אביב - גורדון</option>
        <option value="dolphinarium">תל אביב - דולפינריום</option>
        <option value="maravi">תל אביב - חוף מערבי</option>
        <option value="bat-yam">בת ים - החוף הנפרד</option>
        <option value="rishon">ראשון לציון</option>
        <option value="palmachim">פלמחים</option>

        <!-- צפון -->
        <option value="betzet">בצת</option>
        <option value="nahariya">נהריה - סוקולוב</option>
        <option value="shavei-zion">שבי ציון</option>
        <option value="akko">עכו - חוף הסוסים</option>
        <option value="kiriat-haim">קריית חיים</option>
        <option value="haifa-peak">חיפה - הפיק</option>
        <option value="haifa-backdoor">חיפה - בקדור</option>
        <option value="haifa-casino">חיפה - קזינו בת גלים</option>
        <option value="haifa-kedarim">חיפה - קדרים</option>
        <option value="atlit">עתלית</option>
        <option value="neve-yam">נווה ים</option>
        <option value="habonim">הבונים</option>
        <option value="nahsholim">נחשולים</option>
        <option value="dor">דור / טנטורה</option>
        <option value="jisr">ג'סר א-זרקא</option>

        <!-- דרום -->
        <option value="ashdod">אשדוד - חוף הקשתות</option>
        <option value="ashdod-gil">אשדוד - חוף גיל</option>
        <option value="ashdod-mi-ami">אשדוד - מי עמי</option>
        <option value="ashdod-citadel">אשדוד - המצודה</option>
        <option value="ashqelon">אשקלון - דלילה</option>
        <option value="zikim">זיקים</option>

        <!-- אחר -->
        <option value="kinneret">כנרת</option>
        <option value="eilat">אילת</option>
      </select>

      <label for="hourSelect">שעת תחזית לטבלה:</label>
      <select id="hourSelect">
        <option value="6">06:00 (בוקר)</option>
        <option value="9">09:00 (בוקר מאוחר)</option>
        <option value="12" selected>12:00 (צהריים)</option>
        <option value="15">15:00 (אחר הצהריים)</option>
        <option value="18">18:00 (ערב)</option>
      </select>

      <button onclick="triggerGitHubWorkflow()">🚀 עדכן את המכשיר</button>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- הגדרות חיבור ל-GitHub -->
    <div class="card hidden" id="settingsCard">
      <label for="ghUser">GitHub Username:</label>
      <input type="text" id="ghUser" placeholder="nery93-web">

      <label for="ghRepo">Repository Name:</label>
      <input type="text" id="ghRepo" placeholder="trmnl-surf">

      <label for="ghToken">Personal Access Token (PAT):</label>
      <input type="password" id="ghToken" placeholder="github_pat_...">

      <button onclick="saveSettings()" style="background: #475569;">שמור הגדרות</button>
    </div>

    <div class="settings-toggle" onclick="toggleSettings()">⚙️ הגדרות חיבור (פעם אחת בלבד)</div>
  </div>

  <script>
    window.onload = function() {
      if(localStorage.getItem('gh_user')) document.getElementById('ghUser').value = localStorage.getItem('gh_user');
      if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
      if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
      
      if(!localStorage.getItem('gh_token')) {
        document.getElementById('settingsCard').classList.remove('hidden');
      }
    };

    function toggleSettings() {
      document.getElementById('settingsCard').classList.toggle('hidden');
    }

    function saveSettings() {
      const u = document.getElementById('ghUser').value.trim();
      const r = document.getElementById('ghRepo').value.trim();
      const t = document.getElementById('ghToken').value.trim();

      localStorage.setItem('gh_user', u);
      localStorage.setItem('gh_repo', r);
      localStorage.setItem('gh_token', t);
      
      alert('ההגדרות נשמרו בטלפון!');
      document.getElementById('settingsCard').classList.add('hidden');
    }

    async function triggerGitHubWorkflow() {
      const beach = document.getElementById('beachSelect').value;
      const hour = document.getElementById('hourSelect').value;
      const user = (localStorage.getItem('gh_user') || '').trim();
      const repo = (localStorage.getItem('gh_repo') || '').trim();
      const token = (localStorage.getItem('gh_token') || '').trim();
      const status = document.getElementById('statusMsg');

      if (!user || !repo || !token) {
        alert('אנא הזן תחילה את הגדרות ה-GitHub שלך מאיזור ההגדרות בתחתית הדף.');
        document.getElementById('settingsCard').classList.remove('hidden');
        return;
      }

      status.style.display = 'block';
      status.className = 'status-msg status-info';
      status.innerText = 'מפעיל עדכון ב-GitHub...';

      // רשימת קבצים מועדפת לניסיון ישיר
      const candidateFiles = ['surf.yml', 'Surf.yml', 'main.yml'];

      for (let file of candidateFiles) {
        const directUrl = `https://api.github.com/repos/${user}/${repo}/actions/workflows/${file}/dispatches`;
        try {
          const res = await fetch(directUrl, {
            method: 'POST',
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28'
            },
            body: JSON.stringify({
              ref: 'main',
              inputs: { beach, hour }
            })
          });

          if (res.status === 204) {
            status.className = 'status-msg status-success';
            status.innerText = '✅ הנתונים נשלחו! הטרמינל יתעדכן תוך שניות.';
            return;
          }
        } catch (e) {
          // ממשיך לניסיון הבא
        }
      }

      // גיבוי: איתור דינמי של כל קובץ Workflow קיים ב-Repo
      try {
        const listUrl = `https://api.github.com/repos/${user}/${repo}/actions/workflows`;
        const listRes = await fetch(listUrl, {
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (!listRes.ok) {
          const errData = await listRes.json();
          throw new Error(errData.message || `שגיאה בגישה ל-Repo (${listRes.status})`);
        }

        const listData = await listRes.json();
        if (!listData.workflows || listData.workflows.length === 0) {
          throw new Error('לא נמצאו קבצי Workflow ב-Repository');
        }

        const wfId = listData.workflows[0].id;
        const dispatchUrl = `https://api.github.com/repos/${user}/${repo}/actions/workflows/${wfId}/dispatches`;
        
        const response = await fetch(dispatchUrl, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { beach, hour }
          })
        });

        if (response.status === 204) {
          status.className = 'status-msg status-success';
          status.innerText = '✅ הנתונים נשלחו! הטרמינל יתעדכן תוך שניות.';
        } else {
          const errData = await response.json();
          throw new Error(errData.message || 'שגיאה בהפעלה');
        }
      } catch (err) {
        status.className = 'status-msg status-error';
        status.innerText = '❌ ' + err.message;
      }
    }
  </script>
</body>
</html>
